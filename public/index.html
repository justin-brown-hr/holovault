<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holo Vault — Card Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      border-bottom: 2px solid #e63946;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.3rem; color: #fff; letter-spacing: 1px; }
    header h1 span { color: #e63946; }

    .sync-btn {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .sync-btn:hover { background: #c1121f; }
    .sync-btn:disabled { background: #555; cursor: not-allowed; }

    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .help-link {
      color: #93c5fd;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
    }
    .help-link:hover { background: #1e293b; color: #fff; }
    .delete-all-btn {
      background: transparent;
      color: #f87171;
      border: 1px solid #7f1d1d;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s;
    }
    .delete-all-btn:hover { background: #450a0a; border-color: #f87171; }
    .delete-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Split Layout ── */
    .split {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 53px);
    }

    /* ── LEFT PANEL — Managed Products ── */
    .left-panel {
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .left-panel-header {
      padding: 16px;
      border-bottom: 1px solid #222;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .left-panel-header__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .left-panel-header h2 { font-size: 0.95rem; color: #fff; }

    .delete-all-panel-btn {
      width: 100%;
      background: #2a0a0a;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .delete-all-panel-btn:hover { background: #450a0a; }
    .delete-all-panel-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .left-panel-header span {
      background: #1d3557;
      color: #60a5fa;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    #products-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      transition: border-color 0.2s;
    }
    .product-card:hover { border-color: #444; }

    .product-card .p-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .product-card .p-qty {
      font-size: 0.72rem;
      color: #86efac;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-card .p-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .product-card .p-delete-btn {
      margin-left: auto;
      background: transparent;
      color: #f87171;
      border: 1px solid #f87171;
      border-radius: 5px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.2s, color 0.2s;
    }
    .product-card .p-delete-btn:hover { background: #f87171; color: #fff; }

    .product-card .p-mult-label { font-size: 0.75rem; color: #888; }

    .product-card .p-mult-input {
      width: 60px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 3px 6px;
      color: #e0e0e0;
      font-size: 0.8rem;
    }

    .product-card .p-save-btn {
      background: #1d3557;
      color: #fff;
      border: 1px solid #457b9d;
      border-radius: 5px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.2s;
    }
    .product-card .p-save-btn:hover { background: #457b9d; }

    /* ── RIGHT PANEL — Search ── */
    .right-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-bar {
      padding: 16px;
      border-bottom: 1px solid #222;
      background: #111;
      flex-shrink: 0;
    }

    .search-bar h2 { font-size: 0.95rem; color: #fff; margin-bottom: 10px; }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 9px 14px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-row input:focus { border-color: #e63946; }

    .search-row button {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .search-row button:hover { background: #c1121f; }
    .search-row button:disabled { background: #555; cursor: not-allowed; }

    #search-results {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .card-item {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .card-item:hover { border-color: #e63946; transform: translateY(-2px); }

    .card-item img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      background: #111;
    }

    .card-info { padding: 8px; }
    .card-name { font-size: 0.8rem; font-weight: 600; color: #fff; margin-bottom: 3px; line-height: 1.3; }
    .card-set { font-size: 0.7rem; color: #888; margin-bottom: 5px; }
    .card-finish {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 5px;
    }

    .bulk-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .bulk-bar--idle .bulk-btn-primary { opacity: 0.45; pointer-events: none; }
    .bulk-bar label { font-size: 0.8rem; color: #aaa; }
    .bulk-bar input[type="number"] {
      width: 64px;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
    }
    .bulk-btn {
      background: #457b9d;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .bulk-btn-primary {
      background: #16a34a;
      font-size: 0.9rem;
      padding: 10px 18px;
    }
    .bulk-btn-primary:hover { background: #15803d; }
    .bulk-btn:hover { background: #3a6a8a; }
    .bulk-btn:disabled { background: #444; cursor: not-allowed; }
    .bulk-btn.secondary { background: #333; border: 1px solid #555; }
    .bulk-hint { font-size: 0.75rem; color: #888; flex: 1 1 100%; }
    .card-select {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: #aaa;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .card-select input { cursor: pointer; accent-color: #16a34a; }
    .bulk-select-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: #aaa;
    }
    .bulk-select-row a { color: #60a5fa; cursor: pointer; }

    .import-queue {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      border-top: 2px solid #16a34a;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 500;
      transform: translateY(100%);
      transition: transform 0.25s;
    }
    .import-queue.visible { transform: translateY(0); }
    .import-queue strong { color: #fff; }
    .import-queue .bulk-btn-primary { padding: 10px 24px; }

    .bulk-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .bulk-overlay.visible { display: flex; }
    .bulk-modal {
      background: #1a1a2e;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .bulk-modal h3 { color: #fff; margin-bottom: 12px; }
    .bulk-modal p { color: #aaa; font-size: 0.9rem; margin-bottom: 16px; }
    .bulk-progress {
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .bulk-progress__bar {
      height: 100%;
      background: linear-gradient(90deg, #e63946, #457b9d);
      width: 0%;
      transition: width 0.3s;
    }
    .card-price { font-size: 0.95rem; font-weight: 700; color: #4ade80; }
    .card-change { font-size: 0.7rem; margin-top: 2px; }
    .card-change.up { color: #4ade80; }
    .card-change.down { color: #f87171; }

    .add-row { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .add-row label { font-size: 0.7rem; color: #888; }
    .add-row input[type="number"] {
      width: 60px;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 4px 6px;
      color: #e0e0e0;
      font-size: 0.75rem;
    }

    .add-card-btn {
      width: 100%;
      margin-top: 5px;
      background: #1d3557;
      color: #fff;
      border: 1px solid #457b9d;
      border-radius: 6px;
      padding: 5px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .add-card-btn:hover { background: #457b9d; }
    .add-card-btn:disabled { background: #333; border-color: #444; cursor: not-allowed; }
    .add-card-btn.added { background: #166534; border-color: #4ade80; }
    .add-card-btn.already { background: #1e3a5f; border-color: #60a5fa; }
    .card-already {
      font-size: 0.68rem;
      color: #93c5fd;
      margin-bottom: 6px;
      font-weight: 700;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1a1a2e;
      border: 1px solid #457b9d;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
      max-width: 300px;
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: #e63946; }
    #toast.success { border-color: #4ade80; }

    .empty-state { color: #555; text-align: center; padding: 32px; font-size: 0.85rem; grid-column: 1/-1; }
    .loading { color: #888; text-align: center; padding: 20px; grid-column: 1/-1; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    @media (max-width: 768px) {
      .split { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .left-panel { height: 300px; border-right: none; border-bottom: 1px solid #222; }
      #search-results { height: auto; }
    }
  </style>
</head>
<body>

<header>
  <h1>Holo Vault <span>Card Manager</span></h1>
  <div class="header-actions">
    <a href="/usage.html" class="help-link" title="How to use Card Manager">? Usage</a>
    <button class="sync-btn" id="sync-btn" onclick="triggerSync()">⟳ Sync Prices Now</button>
    <button class="delete-all-btn" id="delete-all-header-btn" type="button" onclick="deleteAllProducts()">Delete all</button>
  </div>
</header>

<div class="split">

  <!-- LEFT — Managed Products -->
  <div class="left-panel">
    <div class="left-panel-header">
      <div class="left-panel-header__row">
        <h2>Managed Products</h2>
        <span id="product-count">0</span>
      </div>
      <button class="delete-all-panel-btn" id="delete-all-panel-btn" type="button" onclick="deleteAllProducts()">Delete all managed products</button>
    </div>
    <div id="products-list"><div class="loading">Loading...</div></div>
  </div>

  <!-- RIGHT — Search & Add -->
  <div class="right-panel">
    <div class="search-bar">
      <h2>Search &amp; Add Card from Collectr</h2>
      <div class="search-row">
        <input
          type="text"
          id="search-input"
          placeholder="Search card name (e.g. Charizard, Pikachu ex...)"
          onkeydown="if(event.key==='Enter') doSearch()"
        />
        <button id="search-btn" onclick="doSearch()">Search</button>
      </div>
      <div class="bulk-bar bulk-bar--idle" id="bulk-bar">
        <button type="button" class="bulk-btn bulk-btn-primary" id="bulk-add-selected-btn" onclick="bulkAddSelected()">
          Import selected to Shopify
        </button>
        <button type="button" class="bulk-btn" id="bulk-add-new-btn" onclick="bulkAdd(true)">All new only</button>
        <button type="button" class="bulk-btn secondary" id="bulk-queue-btn" onclick="addSelectedToQueue()">Add selected to queue</button>
        <label>×</label>
        <input type="number" id="bulk-multiplier" value="1.00" min="0.01" max="10" step="0.05" />
        <div class="bulk-select-row">
          <label><input type="checkbox" id="select-all-cards" onchange="toggleSelectAll(this.checked)" /> Select all</label>
          <a onclick="selectNewOnly()">New only</a>
          <a onclick="clearSelection()">Clear</a>
        </div>
        <span class="bulk-hint" id="bulk-hint">Search first, then use Import selected — no need to click each card. ~3 sec per card.</span>
      </div>
    </div>
    <div id="search-results"><div class="empty-state">Search for a card to get started.</div></div>
  </div>

</div>

<div class="bulk-overlay" id="bulk-overlay">
  <div class="bulk-modal">
    <h3>Adding cards to Shopify</h3>
    <p id="bulk-status">Starting…</p>
    <div class="bulk-progress"><div class="bulk-progress__bar" id="bulk-progress-bar"></div></div>
    <p id="bulk-estimate" style="font-size:0.8rem;color:#666"></p>
  </div>
</div>

<div class="import-queue" id="import-queue">
  <span>Queue: <strong id="queue-count">0</strong> cards ready</span>
  <button type="button" class="bulk-btn bulk-btn-primary" onclick="importQueue()">Import queue to Shopify</button>
  <button type="button" class="bulk-btn secondary" onclick="clearQueue()">Clear queue</button>
</div>

<div id="toast"></div>

<script>
  let searchResults = [];
  let selectedIndices = new Set();
  let importQueueCards = [];
  let managedByCollectrId = {};
  let loadProductsTimer = null;

  function scheduleLoadProducts() {
    clearTimeout(loadProductsTimer);
    loadProductsTimer = setTimeout(loadProducts, 500);
  }

  function listingKey(collectrId, subType) {
    const sub = (subType || '').trim().toLowerCase().replace(/_/g, ' ');
    return `${String(collectrId)}::${sub}`;
  }

  // ── Search ─────────────────────────────────────────────────────────────────
  async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (q.length < 2) return showToast('Enter at least 2 characters.', 'error');

    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.textContent = 'Searching...';
    document.getElementById('search-results').innerHTML = '<div class="loading">Fetching from Collectr...</div>';

    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Search failed');
      searchResults = data.cards || [];
      selectedIndices = new Set();
      searchResults.forEach((c, i) => {
        if (isNewCard(c)) selectedIndices.add(i);
      });
      updateBulkBar();
      renderSearchResults(searchResults);
    } catch (err) {
      document.getElementById('search-results').innerHTML = '<div class="empty-state">Search failed. Try again.</div>';
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  }

  function countNewCards() {
    return searchResults.filter((c) => {
      if (!c.collectrId) return false;
      return !managedByCollectrId[listingKey(c.collectrId, c.subType)];
    }).length;
  }

  function isNewCard(card) {
    if (!card.collectrId) return false;
    return !managedByCollectrId[listingKey(card.collectrId, card.subType)];
  }

  function cardsFromIndices(indices) {
    const defaultMult = parseFloat(document.getElementById('bulk-multiplier').value) || 1;
    return [...indices].map((i) => {
      const card = searchResults[i];
      const multEl = document.getElementById(`mult-${i}`);
      const mult = multEl ? parseFloat(multEl.value) : defaultMult;
      return { ...card, _multiplier: mult };
    }).filter((c) => c && c.collectrId);
  }

  function updateBulkBar() {
    const bar = document.getElementById('bulk-bar');
    const hasSearch = searchResults.length > 0;
    bar.classList.toggle('bulk-bar--idle', !hasSearch);

    const sel = selectedIndices.size;
    const newCount = countNewCards();
    document.getElementById('bulk-add-selected-btn').textContent =
      hasSearch ? `Import selected (${sel})` : 'Import selected to Shopify';
    document.getElementById('bulk-add-new-btn').textContent =
      newCount > 0 ? `All new only (${newCount})` : 'All new only (0)';
    document.getElementById('bulk-hint').textContent = hasSearch
      ? `${searchResults.length} results · ${sel} selected · ~${Math.ceil(sel * 3)}s for selected · Use queue to combine multiple searches`
      : 'Search Collectr, tick cards (or Select all), then Import selected — no need to click each Add button.';
    document.getElementById('select-all-cards').checked =
      hasSearch && sel === searchResults.length;
  }

  function toggleSelectAll(checked) {
    selectedIndices = new Set();
    if (checked) searchResults.forEach((_, i) => selectedIndices.add(i));
    updateBulkBar();
    renderSearchResults(searchResults);
  }

  function selectNewOnly() {
    selectedIndices = new Set();
    searchResults.forEach((c, i) => {
      if (isNewCard(c)) selectedIndices.add(i);
    });
    updateBulkBar();
    renderSearchResults(searchResults);
  }

  function clearSelection() {
    selectedIndices.clear();
    updateBulkBar();
    renderSearchResults(searchResults);
  }

  function toggleCardSelect(i, checked) {
    if (checked) selectedIndices.add(i);
    else selectedIndices.delete(i);
    updateBulkBar();
  }

  function updateQueueUI() {
    const el = document.getElementById('import-queue');
    document.getElementById('queue-count').textContent = importQueueCards.length;
    el.classList.toggle('visible', importQueueCards.length > 0);
  }

  function queueKey(card) {
    return listingKey(card.collectrId, card.subType);
  }

  function addSelectedToQueue() {
    const cards = cardsFromIndices(selectedIndices);
    if (!cards.length) return showToast('Select at least one card.', 'error');
    const existing = new Set(importQueueCards.map(queueKey));
    let added = 0;
    for (const card of cards) {
      const k = queueKey(card);
      if (!existing.has(k)) {
        importQueueCards.push(card);
        existing.add(k);
        added++;
      }
    }
    updateQueueUI();
    showToast(`Added ${added} to queue (${importQueueCards.length} total). Search again to add more sets.`, 'success');
  }

  function clearQueue() {
    importQueueCards = [];
    updateQueueUI();
  }

  function importQueue() {
    if (!importQueueCards.length) return showToast('Queue is empty.', 'error');
    runBulkImport(importQueueCards, false).then(() => {
      importQueueCards = [];
      updateQueueUI();
    });
  }

  function bulkAddSelected() {
    const cards = cardsFromIndices(selectedIndices);
    if (!cards.length) return showToast('Select cards to import (checkbox on each card).', 'error');
    return runBulkImport(cards, false);
  }

  function bulkAdd(onlyNew) {
    if (!searchResults.length) return showToast('Search for cards first.', 'error');
    const cards = cardsFromIndices(
      onlyNew
        ? new Set(searchResults.map((c, i) => (isNewCard(c) ? i : -1)).filter((i) => i >= 0))
        : new Set(searchResults.map((_, i) => i))
    );
    if (!cards.length) return showToast('All results already on the store.', 'error');
    return runBulkImport(cards, onlyNew);
  }

  async function runBulkImport(cards, onlyNew) {
    const defaultMult = parseFloat(document.getElementById('bulk-multiplier').value) || 1;
    const msg = `Import ${cards.length} cards to Shopify? (~${Math.ceil(cards.length * 3)} seconds)`;
    if (!confirm(msg)) return;

    const overlay = document.getElementById('bulk-overlay');
    const statusEl = document.getElementById('bulk-status');
    const bar = document.getElementById('bulk-progress-bar');
    const estimateEl = document.getElementById('bulk-estimate');
    overlay.classList.add('visible');
    bar.style.width = '5%';
    statusEl.textContent = `Importing ${cards.length} cards…`;
    estimateEl.textContent = `Please keep this tab open`;

    const disable = (on) => {
      ['bulk-add-selected-btn', 'bulk-add-new-btn', 'bulk-queue-btn', 'search-btn'].forEach((id) => {
        document.getElementById(id).disabled = on;
      });
    };
    disable(true);

    const BATCH = 50;
    const chunks = [];
    for (let i = 0; i < cards.length; i += BATCH) chunks.push(cards.slice(i, i + BATCH));
    const totals = { added: 0, incremented: 0, skipped: 0, failed: 0, durationMs: 0, errors: [] };

    try {
      for (let c = 0; c < chunks.length; c++) {
        const chunk = chunks[c];
        statusEl.textContent = `Batch ${c + 1} of ${chunks.length} (${chunk.length} cards)…`;
        bar.style.width = `${Math.round(((c + 0.2) / chunks.length) * 100)}%`;

        const res = await fetch('/api/bulk-add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cards: chunk, multiplier: defaultMult, onlyNew }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Bulk import failed');

        totals.added += data.added || 0;
        totals.incremented += data.incremented || 0;
        totals.skipped += data.skipped || 0;
        totals.failed += data.failed || 0;
        totals.durationMs += data.durationMs || 0;
        if (data.errors?.length) totals.errors.push(...data.errors);
        bar.style.width = `${Math.round(((c + 1) / chunks.length) * 100)}%`;
      }

      const summary = `Done — ${totals.added} new, ${totals.incremented} stock+1, ${totals.skipped} skipped, ${totals.failed} failed`;
      statusEl.textContent = summary;
      showToast(summary, totals.failed ? 'error' : 'success');
      if (totals.errors.length) console.warn('Bulk errors:', totals.errors);
      await loadProducts();
      if (searchResults.length) {
        selectNewOnly();
        renderSearchResults(searchResults);
      }
      updateBulkBar();
    } catch (err) {
      statusEl.textContent = err.message;
      showToast(err.message, 'error');
    } finally {
      setTimeout(() => overlay.classList.remove('visible'), 2500);
      disable(false);
      bar.style.width = '0%';
    }
  }

  function renderSearchResults(cards) {
    const container = document.getElementById('search-results');
    if (cards.length === 0) {
      container.innerHTML = '<div class="empty-state">No cards found.</div>';
      return;
    }
    container.innerHTML = cards.map((card, i) => {
      const changeClass = card.priceChangePct >= 0 ? 'up' : 'down';
      const changeSign = card.priceChangePct >= 0 ? '+' : '';
      const imgSrc = card.imageUrl || 'https://placehold.co/160x213?text=No+Image';
      const existing = card.collectrId
        ? managedByCollectrId[listingKey(card.collectrId, card.subType)]
        : null;
      const qtyLabel = existing && existing.inventoryQuantity != null ? existing.inventoryQuantity : '?';
      const alreadyHtml = existing
        ? `<div class="card-already">Already on store — qty ${qtyLabel}. Click to add +1.</div>`
        : '';
      const btnLabel = existing ? '+ Add another (qty +1)' : '+ Add to Shopify';
      const btnClass = existing ? 'add-card-btn already' : 'add-card-btn';
      const checked = selectedIndices.has(i) ? 'checked' : '';
      return `
        <div class="card-item">
          <img src="${escHtml(imgSrc)}" alt="${escHtml(card.name)}" loading="lazy" onerror="this.src='https://placehold.co/160x213?text=No+Image'" />
          <div class="card-info">
            <label class="card-select">
              <input type="checkbox" ${checked} onchange="toggleCardSelect(${i}, this.checked)" />
              Select
            </label>
            <div class="card-name">${escHtml(card.name)}</div>
            ${card.subType ? `<div class="card-finish">${escHtml(card.subType)}</div>` : ''}
            ${alreadyHtml}
            <div class="card-set">${escHtml(card.setName || '')}${card.cardNumber ? ' #' + escHtml(card.cardNumber) : ''}</div>
            <div class="card-price">$${card.price.toFixed(2)}</div>
            <div class="card-change ${changeClass}">${changeSign}${card.priceChangePct.toFixed(2)}%</div>
            <div class="add-row">
              <label>×</label>
              <input type="number" id="mult-${i}" value="1.00" min="0.01" max="10" step="0.05" />
            </div>
            <button class="${btnClass}" id="add-btn-${i}" onclick="addCard(${i})">${btnLabel}</button>
          </div>
        </div>`;
    }).join('');
  }

  async function addCard(index) {
    const card = searchResults[index];
    const multiplier = parseFloat(document.getElementById(`mult-${index}`).value) || 1.0;
    const btn = document.getElementById(`add-btn-${index}`);
    btn.disabled = true;
    btn.textContent = 'Adding...';
    try {
      const res = await fetch('/api/add-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ card, multiplier }),
      });
      const data = await res.json();
      if (!res.ok) {
        const extra = data.shopify ? ` (${typeof data.shopify === 'string' ? data.shopify : JSON.stringify(data.shopify)})` : '';
        throw new Error((data.error || 'Failed to add card') + extra);
      }
      if (data.incremented) {
        btn.textContent = `✓ Qty ${data.quantity}`;
        btn.classList.add('added', 'already');
        showToast(`Already listed — stock is now ${data.quantity} at $${data.product.price}`, 'success');
      } else {
        btn.textContent = '✓ Added';
        btn.classList.add('added');
        showToast(`"${card.name}" added at $${data.product.price} (qty 1)`, 'success');
      }
      if (data.warning) showToast(data.warning, 'error');
      scheduleLoadProducts();
      if (searchResults.length) renderSearchResults(searchResults);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '+ Add to Shopify';
      showToast(err.message, 'error');
    }
  }

  // ── Products List ──────────────────────────────────────────────────────────
  async function loadProducts() {
    const container = document.getElementById('products-list');
    try {
      const res = await fetch('/api/products');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load');
      const products = data.products || [];
      managedByCollectrId = {};
      products.forEach((p) => {
        if (p.collectrId) managedByCollectrId[listingKey(p.collectrId, p.subType)] = p;
      });
      updateBulkBar();
      document.getElementById('product-count').textContent = products.length;
      if (products.length === 0) {
        container.innerHTML = '<div class="empty-state">No managed products yet.<br>Add cards from the search panel.</div>';
        return;
      }
      container.innerHTML = products.map((p) => `
        <div class="product-card" id="pcard-${p.productId}">
          <div class="p-title">${escHtml(p.title)}</div>
          <div class="p-qty">Stock: ${p.inventoryQuantity != null ? p.inventoryQuantity : '—'}</div>
          <div class="p-meta">
            <span class="p-mult-label">×</span>
            <input class="p-mult-input" type="number" id="pmult-${p.productId}" value="${p.multiplier}" min="0.01" max="10" step="0.05" />
            <button class="p-save-btn" onclick="saveMultiplier('${p.productId}')">Save</button>
            <button class="p-delete-btn" onclick="deleteProduct('${p.productId}', '${escHtml(p.title)}')">✕ Delete</button>
          </div>
        </div>`).join('');
    } catch (err) {
      container.innerHTML = `<div class="empty-state">Error: ${escHtml(err.message)}</div>`;
    }
  }

  async function deleteAllProducts() {
    const count = parseInt(document.getElementById('product-count').textContent, 10) || 0;
    if (count === 0) return showToast('No managed products to delete.', 'error');

    if (!confirm(`Delete ALL ${count} collectr-managed products from Shopify?\n\nThis cannot be undone.`)) return;
    if (!confirm('Last chance: permanently delete every managed product?')) return;

    const headerBtn = document.getElementById('delete-all-header-btn');
    const panelBtn = document.getElementById('delete-all-panel-btn');
    headerBtn.disabled = true;
    panelBtn.disabled = true;
    panelBtn.textContent = 'Deleting...';

    try {
      const res = await fetch('/api/products/delete-all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ confirm: 'DELETE ALL' }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete all failed');

      const msg = data.failed
        ? `Deleted ${data.deleted} of ${data.total}. ${data.failed} failed.`
        : `Deleted all ${data.deleted} products.`;
      showToast(msg, data.failed ? 'error' : 'success');
      if (data.errors?.length) console.warn('Delete errors:', data.errors);

      managedByCollectrId = {};
      scheduleLoadProducts();
      if (searchResults.length) renderSearchResults(searchResults);
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      headerBtn.disabled = false;
      panelBtn.disabled = false;
      panelBtn.textContent = 'Delete all managed products';
    }
  }

  async function deleteProduct(productId, title) {
    if (!confirm(`Delete "${title}" from Shopify? This cannot be undone.`)) return;
    try {
      const res = await fetch(`/api/products/${productId}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to delete');
      document.getElementById(`pcard-${productId}`)?.remove();
      const count = document.getElementById('product-count');
      count.textContent = Math.max(0, parseInt(count.textContent) - 1);
      showToast(`"${title}" deleted from Shopify.`, 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  async function saveMultiplier(productId) {
    const input = document.getElementById(`pmult-${productId}`);
    const multiplier = parseFloat(input.value);
    if (isNaN(multiplier) || multiplier <= 0) return showToast('Invalid multiplier.', 'error');
    try {
      const res = await fetch(`/api/products/${productId}/multiplier`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ multiplier }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');
      showToast('Multiplier updated!', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    }
  }

  // ── Sync ───────────────────────────────────────────────────────────────────
  async function triggerSync() {
    const btn = document.getElementById('sync-btn');
    btn.disabled = true;
    btn.textContent = 'Syncing...';
    try {
      const res = await fetch('/api/sync', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sync failed');
      const msg = data.failed
        ? `Sync done: ${data.updated} updated, ${data.failed} failed.`
        : `Sync done: ${data.updated} prices updated.`;
      showToast(msg, data.failed ? 'error' : 'success');
      if (data.errors?.length) console.warn('Sync errors:', data.errors);
      scheduleLoadProducts();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '⟳ Sync Prices Now';
    }
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 4000);
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  loadProducts();
</script>
</body>
</html>
